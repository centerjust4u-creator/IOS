<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IOS Quiz 8 | Center JUST</title>
<style>
:root{--navy:#060E24;--gold:#D6B158;--gold2:#f0d58a;--white:#F4F7FC;--muted:#A9B6D3;--green:#3FA66B;--red:#DE4040;--blue:#2454BE;--parch:#F6EFDD;--ink:#1b2236}
*{box-sizing:border-box}
html{background:#060E24}body{margin:0}
body{min-height:100vh;color:var(--white);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 90% 0%,rgba(36,84,190,.35),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid rgba(214,177,88,.55)}
header img{width:44px;height:44px;object-fit:contain}
header .brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.04em;color:var(--gold)}
header .label{margin-left:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:22px 16px}
footer{text-align:center;padding:16px;font-family:Georgia,serif;color:var(--gold);font-size:14px;letter-spacing:.04em;border-top:1px solid rgba(214,177,88,.3)}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.5);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.45);padding:26px 22px;backdrop-filter:blur(4px)}
.center{text-align:center}
.hero img{width:170px;max-width:55%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.hero .name{font-family:Georgia,serif;font-size:28px;color:var(--gold);letter-spacing:.08em;margin:6px 0 0}
.pre{font-size:12px;letter-spacing:.3em;color:var(--muted);margin:22px 0 6px}
h1{font-family:Georgia,serif;font-size:34px;margin:4px 0 10px;font-weight:700}
.rule{width:70px;height:2px;background:var(--gold);margin:12px auto 16px}
.sub{color:var(--muted);margin:0 0 22px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--gold2);background:rgba(214,177,88,.07)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:14px 30px;min-height:48px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;letter-spacing:.04em;box-shadow:0 6px 18px rgba(214,177,88,.25);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.35)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.qhead{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.05em;color:var(--gold);margin-bottom:10px}
.qcard{background:var(--parch);color:var(--ink);border-radius:16px;padding:24px 20px;border:2px solid var(--gold);box-shadow:0 12px 36px rgba(0,0,0,.5);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qtype{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a5f1c;border:1px solid #b99543;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.qtext{font-family:Georgia,serif;font-size:21px;line-height:1.4;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid #d9cfb2;border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;transition:all .18s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px);background:#fffaf0}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:#1b2a57;color:var(--gold2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.ok{background:#2454BE;border-color:#1a3f90;color:#fff}
.opt.ok .l{background:#fff;color:#2454BE}
.opt.bad{background:var(--red);border-color:#a82a2a;color:#fff;animation:shake .4s}
.opt.bad .l{background:#fff;color:var(--red)}
.opt.fade{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600;display:none}
.fb.ok{display:block;background:#dfe8fb;border:1px solid #2454BE;color:#17358a}
.fb.bad{display:block;background:#fbe0e0;border:1px solid var(--red);color:#8f1f1f}
.next{display:flex;justify-content:flex-end;margin-top:16px;min-height:52px}
.score{font-family:Georgia,serif;font-size:76px;color:var(--gold);line-height:1;margin:10px 0}
.msg{color:var(--muted);margin-bottom:18px}
.rev{margin-top:26px}
.rev h2{font-family:Georgia,serif;color:var(--gold);font-size:22px;margin:0 0 4px}
.rev .none{color:var(--green);font-weight:700;padding:14px;border:1px solid var(--green);border-radius:12px;text-align:center}
.ri{background:rgba(255,255,255,.04);border:1px solid rgba(214,177,88,.3);border-left:4px solid var(--red);border-radius:12px;padding:14px;margin-top:12px}
.ri .t{font-family:Georgia,serif;margin-bottom:8px}
.ri .y{color:#ff9a9a;font-size:14px}
.ri .c{color:#7fe0a5;font-size:15px;font-weight:600}
.hide{display:none!important}
@media(max-width:520px){header .label{font-size:10px;letter-spacing:.1em}h1{font-size:27px}.qtext{font-size:19px}.score{font-size:62px}.btn{width:100%}.next .btn{width:auto}}
</style>
</head>

  var s=document.createElement("span");s.textContent=o.t;
  b.appendChild(l);b.appendChild(s);
  b.onclick=function(){pick(q,opts,i,box)};
  box.appendChild(b)});
}
function pick(q,opts,i,box){
 if(locked)return;locked=true;
 var btns=box.children,right=opts[i].c,ci=opts.findIndex(function(o){return o.c});
 for(var k=0;k<btns.length;k++){btns[k].disabled=true;
  if(k===ci)btns[k].classList.add("ok");else if(k===i)btns[k].classList.add("bad");else btns[k].classList.add("fade")}
 var fb=$("fb");
 if(right){score++;fb.className="fb ok";fb.textContent="Correct!"}
 else{missed.push({q:q.q,yours:opts[i].t,right:opts[ci].t});fb.className="fb bad";fb.textContent="Incorrect. Correct answer: "+opts[ci].t}
 $("sc").textContent=score+" correct";
 var n=$("nx");n.textContent=idx===Q.length-1?"See result":"Next question";n.classList.remove("hide");n.focus({preventScroll:true});
}
function finish(){
 $("pb").style.width="100%";$("lab").textContent="IOS Quiz 8 · Result";
 $("pc").textContent=score+" / "+Q.length;
 var p=Math.round(score/Q.length*100);
 $("rs").textContent=p+"% correct"+(p>=80?" — Excellent work!":p>=60?" — Good effort, keep going!":" — Keep practicing, you can do it!");
 var rv=$("rv");rv.innerHTML="";
 var h=document.createElement("h2");h.textContent="Questions answered incorrectly ("+missed.length+")";rv.appendChild(h);
 if(!missed.length){var d=document.createElement("div");d.className="none";d.style.marginTop="12px";d.textContent="Perfect score! You answered every question correctly.";rv.appendChild(d)}
 missed.forEach(function(m,i){
  var d=document.createElement("div");d.className="ri";
  var t=document.createElement("div");t.className="t";t.textContent=(i+1)+". "+m.q;
  var y=document.createElement("div");y.className="y";y.textContent="Your answer: "+m.yours;
  var c=document.createElement("div");c.className="c";c.textContent="Correct answer: "+m.right;
  d.appendChild(t);d.appendChild(y);d.appendChild(c);rv.appendChild(d)});
 show("res");
}
$("go").onclick=begin;
$("rt").onclick=begin;
$("nx").onclick=function(){if(idx===Q.length-1)finish();else{idx++;render()}};
document.addEventListener("keydown",function(e){
 if(e.key==="Enter"&&!$("nx").classList.contains("hide")&&!$("game").classList.contains("hide")){e.preventDefault();$("nx").click()}
});
})();
</script>
