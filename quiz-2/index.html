<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IOS Quiz 2 | Center JUST</title>
<style>
:root{
  --navy:#0a1330; --navy2:#101c44; --navy3:#162557;
  --gold:#c9a24b; --gold2:#e6c97a; --gold-dark:#8a6a22;
  --parch:#f6edd6; --parch2:#ecdfbf; --ink:#1b2236;
  --blue:#1c4fd8; --blue-soft:#dbe6ff; --red:#c0272d; --red-soft:#fde0e0;
  --serif: Georgia, "Times New Roman", "Palatino Linotype", Palatino, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--serif); color:#f3ecd8;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2a66 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #14214d 0%, transparent 60%),
    var(--navy);
  background-attachment:fixed;
  display:flex; justify-content:center; padding:20px 14px 40px;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 14px);
}
.app{width:100%; max-width:760px; position:relative; z-index:1}
.screen{display:none; animation:fade .5s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* logo */
.logo-wrap{text-align:center}
.logo{
  width:150px; height:150px; border-radius:50%; object-fit:cover; display:block; margin:0 auto;
  box-shadow:0 0 0 3px var(--gold), 0 0 0 7px var(--navy), 0 0 0 9px var(--gold-dark), 0 12px 40px rgba(0,0,0,.6);
  animation:float 5s ease-in-out infinite;
}
.logo.small{width:64px;height:64px;box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--navy),0 6px 16px rgba(0,0,0,.5);animation:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand{margin-top:16px; font-size:1.5rem; letter-spacing:.35em; text-transform:uppercase; color:var(--gold2); font-weight:bold; padding-left:.35em}
.brand.small{font-size:.95rem; margin:0; letter-spacing:.25em}
.divider{height:2px;width:160px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* intro */
.hero{padding:30px 12px; text-align:center}
.hero h1{font-size:clamp(1.8rem,6vw,2.7rem); line-height:1.15; color:#fff; margin-top:6px; text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero p.sub{margin:14px auto 22px; max-width:480px; color:#d9d1b8; font-size:1.08rem; font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
.chip{border:1px solid var(--gold-dark); background:rgba(201,162,75,.1); color:var(--gold2); padding:8px 16px; border-radius:999px; font-size:.95rem}
.chip b{color:#fff}

.btn{
  font-family:var(--serif); font-size:1.15rem; font-weight:bold; cursor:pointer; border:none;
  padding:16px 38px; border-radius:12px; min-height:54px;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold-dark));
  color:#1a1405; letter-spacing:.04em; text-transform:uppercase;
  box-shadow:0 6px 0 #6d5217, 0 14px 28px rgba(0,0,0,.45);
  transition:transform .12s, box-shadow .12s, filter .2s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6d5217,0 6px 14px rgba(0,0,0,.4)}
.btn:focus-visible{outline:3px solid #fff; outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top .l{display:flex;align-items:center;gap:12px}
.score-pill{
  border:1px solid var(--gold); color:var(--gold2); padding:8px 16px; border-radius:999px;
  background:rgba(10,19,48,.7); font-size:.98rem; white-space:nowrap
}
.score-pill b{color:#fff; font-size:1.1rem}
.progress-meta{display:flex;justify-content:space-between;font-size:.95rem;color:#cfc7ad;margin-bottom:8px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:18px;border:1px solid rgba(201,162,75,.3)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dark),var(--gold2));transition:width .5s ease;border-radius:999px}

/* card */
.card{
  position:relative;
  background:
    radial-gradient(600px 200px at 20% 0%, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(180deg,var(--parch),var(--parch2));
  color:var(--ink); border-radius:18px; padding:26px 22px 22px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px var(--navy), 0 0 0 7px var(--gold-dark), 0 22px 50px rgba(0,0,0,.55);
}
.qtype{display:inline-block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--navy3);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.qtext{font-size:clamp(1.15rem,3.9vw,1.4rem); line-height:1.45; font-weight:bold; margin-bottom:20px}
.opts{display:grid;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px; text-align:left; width:100%;
  font-family:var(--serif); font-size:1.05rem; line-height:1.4; color:var(--ink);
  background:#fffaf0; border:2px solid #cdb888; border-radius:12px; padding:14px 16px; min-height:58px;
  cursor:pointer; transition:transform .12s, border-color .15s, background .15s, box-shadow .15s;
  box-shadow:0 3px 0 #cdb888;
}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold-dark);background:#fff;box-shadow:0 5px 0 var(--gold)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .k{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:bold;background:var(--navy3);color:var(--gold2);font-size:.95rem}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blue-soft);border-color:var(--blue);box-shadow:0 3px 0 var(--blue);color:#0d2a80;animation:pop .35s}
.opt.correct .k{background:var(--blue);color:#fff}
.opt.wrong{background:var(--red-soft);border-color:var(--red);box-shadow:0 3px 0 var(--red);color:#7c1519;animation:shake .4s}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font-size:1.25rem;font-weight:bold;min-height:70px}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.feedback{display:none;margin-top:18px;border-radius:12px;padding:14px 16px;border-left:6px solid;line-height:1.5;animation:fade .35s}
.feedback.show{display:block}
.feedback.ok{background:var(--blue-soft);border-color:var(--blue);color:#0d2a80}
.feedback.no{background:var(--red-soft);border-color:var(--red);color:#7c1519}
.feedback .verdict{font-weight:bold;font-size:1.1rem;margin-bottom:4px}
.nextwrap{display:none;margin-top:18px;text-align:center}
.nextwrap.show{display:block}
.nextwrap .btn{width:100%;max-width:340px}

/* results */
.results{text-align:center;padding:24px 8px}
.ring{position:relative;width:200px;height:200px;margin:20px auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.6rem;color:#fff;line-height:1}
.ring .num span{color:var(--gold2);font-size:1rem;margin-top:4px}
.results h2{font-size:1.9rem;color:#fff}
.results p{color:#d9d1b8;margin:10px auto 26px;max-width:460px;font-style:italic;font-size:1.08rem}
.final-line{font-size:1.2rem;color:var(--gold2);margin-bottom:6px}

@media (max-width:520px){
  body{padding:14px 10px 30px}
  .card{padding:20px 14px 18px}
  .logo{width:128px;height:128px}
  .opts.tf{grid-template-columns:1fr}
  .brand{font-size:1.2rem}
  .score-pill{padding:6px 12px;font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";

var QUESTIONS = [
  /* ---------- Multiple choice ---------- */
  {type:"mc", q:"Which of the following best defines an international organization?",
   options:["A temporary forum where delegates discuss a single international topic",
            "An entity with an independent international legal personality, composed of states as members and pursuing goals through adherence to international principles",
            "A profit-driven company operating through branches in many states",
            "A private group of individuals that lobbies governments on social issues"],
   answer:1, explain:"An international organization is an entity with its own independent and separate international legal personality, made up of states as members, that aims to achieve certain goals by adhering to certain international principles."},

  {type:"mc", q:"Why do states establish international organizations?",
   options:["To replace the governments of their member states",
            "To achieve shared social or economic objectives that individual state efforts cannot achieve",
            "To make profits for their founding states",
            "To avoid being subject to any form of law"],
   answer:1, explain:"States create international organizations to accomplish generally shared social or economic objectives that are not achieved through the efforts of individual states."},

  {type:"mc", q:"Which organization was created to help reduce disease in developing nations?",
   options:["The International Monetary Fund","The World Bank Group","The World Health Organization","The African Court on Human and Peoples' Rights"],
   answer:2, explain:"The World Health Organization was created to assist in reducing disease in developing nations."},

  {type:"mc", q:"What is the role of the International Monetary Fund (IMF)?",
   options:["Providing loans to member states that face financial difficulties",
            "Resolving disputes between individuals and governments",
            "Drafting treaties on behalf of NGOs",
            "Regulating multinational corporations directly"],
   answer:0, explain:"The IMF provides loans to member states that confront financial difficulties."},

  {type:"mc", q:"Which activity is associated with the World Bank Group?",
   options:["Raising money in international capital markets and lending for development projects and poverty reduction in least developed countries",
            "Settling disputes between states before a court",
            "Supervising elections in member states",
            "Giving legal advice to multinational corporations"],
   answer:0, explain:"The World Bank Group raises money in international capital markets and makes loans for economic development projects and for combating poverty in least developed countries."},

  {type:"mc", q:"Through which kind of document do states normally establish an international organization?",
   options:["A commercial contract between companies","A constitutive instrument or charter","A national court judgment","A press statement by the member states"],
   answer:1, explain:"States normally establish an international organization through a constitutive instrument or charter that sets out its competence, goals and objectives, and also provides for its immunities and privileges."},

  {type:"mc", q:"Which of the following is NOT one of the main elements of an international organization?",
   options:["International legal personality","Independent will","Pursuit of profit for shareholders","Permanent organs"],
   answer:2, explain:"The main elements are international legal personality, independent will, an international agreement laying out its powers, and permanent organs. Profit-seeking is characteristic of multinational corporations, not international organizations."},

  {type:"mc", q:"What is one consequence of an international organization having an independent will?",
   options:["It is managed by delegates sent by its member states",
            "It is managed by its own staff and is not bound by the policies of member states",
            "It cannot be held responsible for harm it causes",
            "It expresses only the collective will of its members"],
   answer:1, explain:"Because it has a separate will, an international organization is run by its own personnel rather than member-state delegates, is not subject to member-state policies and decisions, and must compensate persons it injures."},

  {type:"mc", q:"Which element distinguishes an international organization from an international conference?",
   options:["Having permanent organs with a budget, premises and staff",
            "Being composed of states",
            "Discussing international topics",
            "Having delegates from member states"],
   answer:0, explain:"A conference is a temporary forum on one topic, after which delegates go home. An international organization has permanent organs that function all year and operate indefinitely."},

  {type:"mc", q:"Why are multinational corporations considered actors at the international level?",
   options:["Because they have an international legal personality like states",
            "Because they operate in many states and jurisdictions and can affect the policies of states",
            "Because they are created by treaties between states",
            "Because they are managed by delegates of member states"],
   answer:1, explain:"Multinational corporations may operate in more than 150 states and have a presence in many jurisdictions, so they can have an impact at the international level and affect state policies. A company like Boeing, for example, can influence the policies of the United States."},

  {type:"mc", q:"How is a multinational corporation typically structured legally?",
   options:["It is incorporated under the domestic law of one or two states and operates abroad through branches, affiliates and subsidiaries",
            "It is created by a treaty signed by many states",
            "It has an international legal personality like a state",
            "It is exempt from the laws of every country in which it operates"],
   answer:0, explain:"A multinational corporation is usually incorporated under the domestic law of one or two states, takes that state's nationality, and works in other states through branches, affiliates and subsidiaries."},

  {type:"mc", q:"When did NGOs begin to appear on the international scene?",
   options:["Before the First World War","After the Second World War and amid the Cold War","After the end of the Cold War","During the nineteenth century"],
   answer:1, explain:"NGOs started to appear after the Second World War and amid the Cold War between Washington and Moscow."},

  {type:"mc", q:"What did NGOs succeed in doing with regard to the North American Free Trade Agreement (NAFTA) between the United States, Canada and Mexico?",
   options:["Replacing the governments of the United States, Canada and Mexico",
            "Persuading governments to give attention to issues such as health and safety, labor and debt relief in the agreement",
            "Acquiring international legal personality",
            "Preventing the agreement from being signed"],
   answer:1, explain:"NGOs persuaded the governments of the United States, Canada and Mexico to shift attention to issues such as health and safety, transboundary pollution, consumer protection, child labor and debt relief. Without them, NAFTA would not have included these provisions."},

  {type:"mc", q:"When may an international organization be subject to domestic law?",
   options:["Whenever it performs its main activities","When it acts as a private person, for example by signing lease agreements or buying property","Never, under any circumstances","Only when its member states vote to place it under domestic law"],
   answer:1, explain:"International organizations are normally subject only to public international law, but they may be subject to domestic law when they act as private persons, such as when signing leases or buying and selling property."},

  {type:"mc", q:"Which is one reason individuals remain outside the scope of international legal personality?",
   options:["Individuals are always represented by NGOs",
            "The explicit provisions of the ICJ Statute",
            "Individuals are bound only by the charter of an international organization",
            "Individuals are considered multinational corporations"],
   answer:1, explain:"Individuals remain outside international legal personality due to reasons such as the explicit provisions in the ICJ Statute and the inability of international law to recognize individuals as having international legal personality."},

  {type:"mc", q:"Before which international tribunal can individuals now bring claims against governments?",
   options:["The European Court of Human Rights","The World Health Organization","The International Monetary Fund","The North American Free Trade Commission"],
   answer:0, explain:"Developments in human rights law and international humanitarian law mean individuals can now file claims against governments before tribunals such as the European Court of Human Rights and the African Court on Human and Peoples' Rights."},

  /* ---------- True / False ---------- */
  {type:"tf", q:"An international organization has the right to contract with third parties, acquire rights, and bear obligations.",
   answer:true, explain:"These are consequences of international legal personality: the organization can contract, acquire rights, is subject to obligations, and is responsible for its legal actions."},

  {type:"tf", q:"If an international organization is an independent legal person, its actions are attributed to the organization itself.",
   answer:true, explain:"Independent legal personality means actions taken by the organization are attributed to the organization, not to its members."},

  {type:"tf", q:"An international organization expresses the collective will of its member states rather than its own will.",
   answer:false, explain:"It has a will separate from that of its member states and expresses its own will, not their collective will."},

  {type:"tf", q:"An international organization may be established without any written agreement between states.",
   answer:false, explain:"No international organization may be established without a written agreement between states, which acts as its constitution."},

  {type:"tf", q:"States agree to give up some of their powers in favor of an international organization so that it can achieve common goals.",
   answer:true, explain:"States relinquish some powers to grant the organization the ability to achieve common goals that states would normally fail to achieve alone."},

  {type:"tf", q:"Because international organizations have permanent organs, they operate indefinitely with no time limitation.",
   answer:true, explain:"Permanent organs function throughout the year with a budget, premises and staff, so the organization has no fixed duration."},

  {type:"tf", q:"Multinational corporations are exempt from the domestic laws of the states in which they operate.",
   answer:false, explain:"Even though they are active players internationally, multinational corporations remain subject to domestic laws and regulations."},

  {type:"tf", q:"NGOs have already acquired international legal personality.",
   answer:false, explain:"Despite their active role, NGOs have not yet acquired legal personality; international legal personality is limited to states and international organizations."},

  {type:"tf", q:"NGOs are profit-driven entities, just like multinational corporations.",
   answer:false, explain:"Unlike multinational corporations, NGOs are not profit-driven entities, although they are equally active internationally."},

  {type:"tf", q:"Unlike multinational corporations and NGOs, international organizations are not subject to domestic law when performing their activities.",
   answer:true, explain:"International organizations are subject solely to public international law while performing their activities, unlike multinational corporations and NGOs."},

  {type:"tf", q:"Some multinational corporations can influence their states' decisions on whether to go to war.",
   answer:true, explain:"Due to their economic importance, some multinational corporations influence the decision of their states either to go to war or to refrain from going to war."},

  {type:"tf", q:"Multinational corporations contribute indirectly to the development of international law rules through their practice in many countries.",
   answer:true, explain:"Their varied practice and presence across many countries and jurisdictions contributes indirectly to the development of international law rules."},

  {type:"tf", q:"Individuals can never bring legal actions against governments before any international tribunal.",
   answer:false, explain:"Due to developments in human rights and humanitarian law, individuals now enjoy some rights to bring claims against governments before tribunals such as the European Court of Human Rights."},

  {type:"tf", q:"Developed countries no longer need to invade countries militarily because they can dominate them economically through open markets.",
   answer:true, explain:"Having achieved technological and scientific superiority, developed countries designed a system allowing their large companies to sell everywhere, so profits flow back home and reinforce their economic power."}
];

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function show(id){
  ["intro","quiz","results"].forEach(function(s){$(s).classList.toggle("active",s===id)});
  window.scrollTo({top:0,behavior:"smooth"});
}

var TOTAL = QUESTIONS.length;
var nTF = QUESTIONS.filter(function(q){return q.type==="tf"}).length;
var nMC = TOTAL - nTF;
var order=[], idx=0, score=0, answered=false, current=null, optionSet=[];

$("chips").innerHTML =
  '<span class="chip"><b>'+TOTAL+'</b> Questions</span>'+
  '<span class="chip"><b>'+nMC+'</b> Multiple Choice</span>'+
  '<span class="chip"><b>'+nTF+'</b> True / False</span>';

function startQuiz(){
  order = shuffle(QUESTIONS);
  idx = 0; score = 0;
  $("scoreNow").textContent = "0";
  show("quiz");
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  current = order[idx];
  $("progText").textContent = "Question "+(idx+1)+" of "+TOTAL;
  var pct = Math.round(idx/TOTAL*100);
  $("progPct").textContent = pct+"%";
  $("barFill").style.width = pct+"%";
  $("qtype").textContent = current.type==="tf" ? "True / False" : "Multiple Choice";
  $("qtext").textContent = current.q;
  $("feedback").className="feedback";
  $("nextwrap").className="nextwrap";
  $("nextBtn").textContent = (idx===TOTAL-1) ? "See my score" : "Next question";

  var box = $("opts"); box.innerHTML="";
  if(current.type==="tf"){
    box.className="opts tf";
    optionSet=[{label:"True",correct:current.answer===true,value:true},{label:"False",correct:current.answer===false,value:false}];
  }else{
    box.className="opts";
    optionSet = shuffle(current.options.map(function(t,i){return {label:t,correct:i===current.answer}}));
  }
  optionSet.forEach(function(o,i){
    var b=document.createElement("button");
    b.type="button"; b.className="opt";
    if(current.type==="mc"){
      var k=document.createElement("span"); k.className="k"; k.textContent="ABCD".charAt(i); b.appendChild(k);
    }
    var s=document.createElement("span"); s.textContent=o.label; b.appendChild(s);
    b.addEventListener("click",function(){choose(i)});
    box.appendChild(b);
  });
}

function choose(i){
  if(answered) return;
  answered=true;
  var btns=$("opts").querySelectorAll(".opt");
  var ok = optionSet[i].correct;
  if(ok) score++;
  $("scoreNow").textContent = score;
  btns.forEach(function(b,j){
    b.disabled=true;
    if(optionSet[j].correct) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(!ok){
    // reveal correct answer (already marked) - make sure it is not dimmed
  }
  var fb=$("feedback");
  fb.className="feedback show "+(ok?"ok":"no");
  $("verdict").textContent = ok ? "\u2714 Correct!" : "\u2718 Incorrect";
  $("explain").textContent = current.explain;
  $("nextwrap").className="nextwrap show";
  $("barFill").style.width = Math.round((idx+1)/TOTAL*100)+"%";
  $("progPct").textContent = Math.round((idx+1)/TOTAL*100)+"%";
  setTimeout(function(){$("nextwrap").scrollIntoView({behavior:"smooth",block:"nearest"})},120);
}

function next(){
  if(!answered) return;
  idx++;
  if(idx>=TOTAL) finish(); else renderQuestion();
}

function finish(){
  show("results");
  var pct = Math.round(score/TOTAL*100);
  $("finalScore").textContent = score+"/"+TOTAL;
  $("finalPct").textContent = pct+"%";
  $("finalLine").textContent = "Final score: "+score+" / "+TOTAL;
  var title, msg;
  if(pct>=90){title="Outstanding!";msg="Excellent mastery of the subject. Keep up the superb work."}
  else if(pct>=75){title="Well Done!";msg="A strong result. A quick review of the missed points and you will be there."}
  else if(pct>=50){title="Good Effort";msg="You are on the right track. Review the topics you missed and try again."}
  else{title="Keep Practicing";msg="Do not be discouraged. Review the material and restart the quiz to improve."}
  $("resTitle").textContent=title; $("resMsg").textContent=msg;
  var ring=$("ringFill"); ring.style.strokeDashoffset="553";
  setTimeout(function(){ring.style.strokeDashoffset=String(553-(553*score/TOTAL))},150);
}

$("startBtn").addEventListener("click",startQuiz);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",startQuiz);

document.addEventListener("keydown",function(e){
  if(!$("quiz").classList.contains("active")) return;
  var k=e.key.toLowerCase();
  if(!answered){
    var map={"a":0,"b":1,"c":2,"d":3,"1":0,"2":1,"3":2,"4":3};
    if(current.type==="tf"){ if(k==="t") choose(0); else if(k==="f") choose(1); else if(k==="1") choose(0); else if(k==="2") choose(1); }
    else if(map.hasOwnProperty(k) && map[k]<optionSet.length) choose(map[k]);
  }else if(e.key==="Enter" && document.activeElement.id!=="nextBtn"){ next(); }
});
})();
</script>
</body>
</html>
