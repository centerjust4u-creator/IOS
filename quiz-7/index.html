<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Int. Organizations Quiz 7 | Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--text:#F4F7FC;--muted:#A9B6D3;--green:#3FA66B;--red:#DE4040;--parch:#F6EFDD;--ink:#1B2336}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;text-align:center;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 100% 0%,rgba(36,84,190,.4),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(214,177,88,.07),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%),#060E24}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 14px}
.brand img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.brand .name{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px auto 16px;max-width:520px}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin:0 auto 18px;max-width:760px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8923a,var(--gold));transition:width .5s ease}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.45);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:28px 22px;backdrop-filter:blur(6px)}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.2;margin-bottom:10px}
.gline{width:70px;height:3px;background:var(--gold);margin:14px auto;border-radius:3px}
.sub{color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:8px 16px;font-size:.92rem;background:rgba(214,177,88,.08)}
.chip b{color:var(--gold)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 34px;font-weight:700;font-size:1.05rem;letter-spacing:.04em;background:linear-gradient(180deg,#e6c677,var(--gold));color:#1a1405;box-shadow:0 6px 18px rgba(214,177,88,.25);transition:transform .15s,box-shadow .15s;min-height:50px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.35)}
.btn:active{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:.95rem;color:var(--muted)}
.top .sc{color:var(--gold);font-weight:700}
.qcard{background:var(--parch);color:var(--ink);border-radius:14px;padding:24px 20px;margin-bottom:18px;border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.qtype{font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:#8a6b1c;font-weight:700;margin-bottom:8px}
.qtext{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.15rem,3.8vw,1.5rem);line-height:1.4}
.opts{display:grid;gap:12px}
.opt{font:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:58px;padding:13px 16px;border-radius:12px;border:1.5px solid rgba(214,177,88,.5);background:rgba(255,255,255,.06);color:var(--text);font-size:1.02rem;transition:transform .15s,background .2s,border-color .2s,opacity .3s}
.opt:hover:not(:disabled){transform:translateX(4px);background:rgba(214,177,88,.14);border-color:var(--gold)}
.opt .b{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:rgba(214,177,88,.18);color:var(--gold);border:1px solid var(--gold)}
.opt:disabled{cursor:default}
.opt.right{background:rgba(36,84,190,.55);border-color:#6f9bff;box-shadow:0 0 0 2px rgba(111,155,255,.35)}
.opt.right .b{background:#6f9bff;color:#06122e;border-color:#6f9bff}
.opt.wrong{background:rgba(222,64,64,.28);border-color:var(--red);animation:shake .4s}
.opt.wrong .b{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;font-size:1rem;animation:fade .3s}
.fb.on{display:block}
.fb.ok{background:rgba(36,84,190,.35);border:1px solid #6f9bff}
.fb.no{background:rgba(222,64,64,.18);border:1px solid var(--red)}
.fb b{font-size:1.1rem}
.next{display:none;margin-top:18px;text-align:right}
.next.on{display:block}
.big{font-family:Georgia,serif;font-size:clamp(3.2rem,16vw,5.5rem);color:var(--gold);line-height:1}
.ring{width:170px;height:170px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.1) 0)}
.ring div{width:140px;height:140px;border-radius:50%;background:#0b1633;display:grid;place-items:center;font-family:Georgia,serif;font-size:2.4rem;color:var(--gold)}
.msg{font-size:1.1rem;color:var(--muted);margin:6px 0 20px}
.rv{margin-top:26px;text-align:left}
.rv h2{font-family:Georgia,serif;text-align:center;font-size:1.35rem;color:var(--gold);margin-bottom:14px}
.ri{background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.35);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ri p{font-family:Georgia,serif;margin-bottom:8px}
.ri .y{color:#ff8e8e;font-size:.95rem}
.ri .c{color:#8fb4ff;font-size:.95rem;font-weight:600}
.perfect{text-align:center;padding:16px;border:1px dashed var(--gold);border-radius:12px;color:var(--gold)}
footer{margin-top:26px;font-size:.78rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
@media(max-width:480px){.panel{padding:22px 14px}.brand img{width:72px;height:72px}.btn{width:100%}.next{text-align:center}}
</style>
</head>

var L="ABCD";
var bank=[],order=[],i=0,correct=0,missed=[],locked=false;
DATA.tf.forEach(function(q){bank.push({t:"tf",q:q[0],o:["True","False"],a:q[1]?0:1});});
DATA.mc.forEach(function(q){bank.push({t:"mc",q:q[0],o:q[1],a:q[2]});});
var TOTAL=bank.length;
function $(id){return document.getElementById(id);}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
function show(id){["s-start","s-quiz","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id);});window.scrollTo(0,0);}
$("chips").innerHTML='<span class="chip"><b>'+TOTAL+'</b> Questions</span><span class="chip"><b>'+DATA.tf.length+'</b> True / False</span><span class="chip"><b>'+DATA.mc.length+'</b> Multiple Choice</span>';
function start(){
  order=shuffle(bank.map(function(_,k){return k;}));
  i=0;correct=0;missed=[];
  show("s-quiz");render();
}
function render(){
  var b=bank[order[i]];locked=false;
  $("prog").textContent="Question "+(i+1)+" of "+TOTAL;
  $("score").textContent=correct+" correct";
  $("pb").style.width=(i/TOTAL*100)+"%";
  $("qtype").textContent=b.t==="tf"?"True or False":"Multiple Choice";
  $("qtext").textContent=b.q;
  var idx=b.o.map(function(_,k){return k;});
  if(b.t==="mc")idx=shuffle(idx);
  var box=$("opts");box.innerHTML="";
  idx.forEach(function(orig,pos){
    var btn=document.createElement("button");btn.className="opt";btn.type="button";
    btn.innerHTML='<span class="b">'+L[pos]+'</span><span></span>';
    btn.lastChild.textContent=b.o[orig];
    btn.onclick=function(){answer(btn,orig,idx);};
    btn.dataset.orig=orig;
    box.appendChild(btn);
  });
  $("fb").className="fb";$("next").className="next";
  $("nextBtn").textContent=(i===TOTAL-1)?"See result":"Next question";
}
function answer(btn,orig){
  if(locked)return;locked=true;
  var b=bank[order[i]];var ok=(orig===b.a);
  var btns=$("opts").children;
  for(var k=0;k<btns.length;k++){
    var o=+btns[k].dataset.orig;btns[k].disabled=true;
    if(o===b.a)btns[k].classList.add("right");
    else if(btns[k]===btn)btns[k].classList.add("wrong");
    else btns[k].classList.add("dim");
  }
  if(ok){correct++;}else{missed.push({q:b.q,y:b.o[orig],c:b.o[b.a]});}
  $("score").textContent=correct+" correct";
  var fb=$("fb");fb.className="fb on "+(ok?"ok":"no");
  fb.innerHTML="";
  var h=document.createElement("b");h.textContent=ok?"Correct!":"Not quite.";fb.appendChild(h);
  if(!ok){var p=document.createElement("div");p.textContent="Correct answer: "+b.o[b.a];fb.appendChild(p);}
  $("next").className="next on";
  $("pb").style.width=((i+1)/TOTAL*100)+"%";
}
function next(){
  if(!locked)return;
  if(i<TOTAL-1){i++;render();}else finish();
}
function finish(){
  show("s-end");
  var pc=Math.round(correct/TOTAL*100);
  $("pb").style.width="100%";
  $("ring").style.setProperty("--p",pc+"%");
  $("pct").textContent=pc+"%";
  $("final").textContent=correct+" / "+TOTAL;
  $("emsg").textContent=pc===100?"Perfect score. Outstanding work!":pc>=80?"Excellent work!":pc>=60?"Good effort. Review the questions below.":"Keep practicing. Review the questions below.";
  var rv=$("rv");rv.innerHTML="";
  if(!missed.length){rv.innerHTML='<div class="perfect">You answered every question correctly.</div>';return;}
  var h=document.createElement("h2");h.textContent="Questions to review ("+missed.length+")";rv.appendChild(h);
  missed.forEach(function(m,n){
    var d=document.createElement("div");d.className="ri";
    var p=document.createElement("p");p.textContent=(n+1)+". "+m.q;
    var y=document.createElement("div");y.className="y";y.textContent="Your answer: "+m.y;
    var c=document.createElement("div");c.className="c";c.textContent="Correct answer: "+m.c;
    d.appendChild(p);d.appendChild(y);d.appendChild(c);rv.appendChild(d);
  });
}
$("startBtn").onclick=start;$("restartBtn").onclick=start;$("nextBtn").onclick=next;
document.addEventListener("keydown",function(e){
  if(!$("s-quiz").classList.contains("on"))return;
  if(e.key==="Enter"){next();return;}
  var k=L.indexOf(e.key.toUpperCase());
  if(k>-1&&!locked&&$("opts").children[k])$("opts").children[k].click();
});
})();
</script>
</body>
</html>
