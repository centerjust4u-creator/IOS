<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IOS Quiz 5 · Center JUST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#060E24;--gold:#D6B158;--blue:#2454BE;--white:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040}
html,body{min-height:100%}
body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 100% 0%,rgba(36,84,190,.35),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;object-fit:contain;flex:none}
.brand b{font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.08em;white-space:nowrap;display:block}
.brand small{color:var(--gold);font-style:italic;font-size:.72rem;display:block}
.tag{color:var(--gold);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8923c,var(--gold));transition:width .4s}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px}
.panel{background:rgba(255,255,255,.045);border:1px solid rgba(214,177,88,.4);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:28px;backdrop-filter:blur(6px)}
.center{text-align:center}
.hero img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 18px rgba(214,177,88,.3))}
.pre{color:var(--gold);letter-spacing:.3em;font-size:.75rem;margin-top:8px}
h1{font-family:Georgia,serif;font-size:2.1rem;margin:10px 0;line-height:1.2}
.rule{width:70px;height:2px;background:var(--gold);margin:14px auto}
.sub{color:var(--mut);max-width:480px;margin:0 auto 18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:99px;padding:6px 14px;font-size:.85rem;color:var(--gold);background:rgba(214,177,88,.07)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 30px;font-weight:700;letter-spacing:.06em;color:#0a1330;background:linear-gradient(180deg,#e6c673,#c49c3e);box-shadow:0 6px 20px rgba(214,177,88,.3);min-height:48px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:16px}
.row b{color:var(--gold)}
.q{font-family:Georgia,serif;font-size:1.4rem;line-height:1.4;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--white);cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.35);border-radius:12px;padding:14px 16px;margin-bottom:10px;min-height:56px;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(214,177,88,.1);transform:translateX(4px)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}
.opt:disabled{cursor:default}
.opt.ok{background:rgba(36,84,190,.55);border-color:#6f9bff;box-shadow:0 0 0 1px #6f9bff,0 0 22px rgba(36,84,190,.6)}
.opt.ok .l{background:#6f9bff;color:#06102e;border-color:#6f9bff}
.opt.bad{background:rgba(222,64,64,.25);border-color:var(--red)}
.opt.bad .l{background:var(--red);color:#fff;border-color:var(--red)}
.opt.fade{opacity:.4}
.fb{border-radius:12px;padding:14px 16px;margin:14px 0;border:1px solid}
.fb.ok{background:rgba(36,84,190,.25);border-color:#6f9bff}
.fb.bad{background:rgba(222,64,64,.15);border-color:var(--red)}
.fb strong{display:block;font-family:Georgia,serif;font-size:1.1rem;margin-bottom:4px}
.fb p{color:#dbe3f5;font-size:.95rem}
.next{text-align:right}
.score{font-family:Georgia,serif;font-size:4.5rem;color:var(--gold);line-height:1}
.hidden{display:none}
.msg{color:var(--mut);margin:8px 0 20px}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:0 16px 24px;letter-spacing:.08em}
.pop{animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:600px){.brand small{display:none}.tag{font-size:.62rem;letter-spacing:.12em}.panel{padding:20px 16px}h1{font-size:1.6rem}.q{font-size:1.2rem}.brand b{font-size:1.05rem}}
</style></head><body>

<script>
var TF=[{"q": "A private company can become a member of an international organization if it agrees to follow the organization's rules.", "a": false, "e": "Membership in an international organization is for states, so agreeing to follow the rules does not make a private company a member."}, {"q": "A state seeking membership in an international organization may be required to recognize the prohibition of the use of force.", "a": true, "e": "Substantive requirements for membership can include recognizing the prohibition of the use of force."}, {"q": "Original membership refers to states that join an international organization after its establishment.", "a": false, "e": "Original members are the states that took part in establishing the organization; those joining later are admitted by accession."}, {"q": "Original members and members admitted by accession have the same legal rights and obligations.", "a": true, "e": "The difference between them is practical, not legal: both enjoy the same rights and carry the same obligations."}, {"q": "Original members have the opportunity to participate in drafting the constitutive instrument of an international organization.", "a": true, "e": "Taking part in drafting the constitutive instrument is the principal practical difference for original members."}, {"q": "Withdrawal from an international organization always requires the approval of every other member state.", "a": false, "e": "The prevailing opinion is that a member has the right to withdraw, provided it notifies the organization."}, {"q": "The Covenant of the League of Nations required a two-year notice before a member state could withdraw.", "a": true, "e": "Under the Covenant, withdrawal required a two-year notice and fulfillment of international obligations."}, {"q": "The United Nations Charter explicitly prohibits member states from withdrawing from the organization.", "a": false, "e": "The Charter contains no explicit prohibition on withdrawal."}, {"q": "Indonesia notified the United Nations of its withdrawal in 1965 following Malaysia's election to the Security Council.", "a": true, "e": "Indonesia gave notice of withdrawal in January 1965 after Malaysia was elected to the Security Council."}, {"q": "Suspension of membership automatically results in the permanent termination of a state's membership.", "a": false, "e": "Suspension is only a temporary restriction of participation; it does not end membership."}, {"q": "Under Article 6 of the United Nations Charter, the General Assembly may expel a member state upon the recommendation of the Security Council.", "a": true, "e": "Article 6 involves both bodies: the General Assembly expels on the Security Council's recommendation."}, {"q": "The Soviet Union was expelled from the League of Nations in 1939 following its aggression against Finland.", "a": true, "e": "The League expelled the Soviet Union in 1939 after its aggression against Finland."}, {"q": "Under the one-state-one-vote system, the number of votes allocated to each state depends on its population.", "a": false, "e": "One-state-one-vote rests on the equality of states, so population does not change a state's number of votes."}, {"q": "Weighted voting in international economic institutions may depend on a state's economic size and financial contribution.", "a": true, "e": "In economic institutions such as the IMF, voting power can reflect economic size and financial contribution."}, {"q": "Voting by consensus requires the agreement of all member states present at the session.", "a": true, "e": "Consensus means every member state present agrees, not merely a majority."}];var MC=[{"q": "Which of the following is a substantive requirement for membership in an international organization?", "c": "Being a peace-loving state", "w": ["Having a large population", "Possessing a strong military", "Having a developed economy"], "e": "Being a peace-loving state is a substantive membership requirement; size, military strength and economic development are not."}, {"q": "Which of the following is NOT a right normally associated with membership in an international organization?", "c": "Unilaterally changing the organization's constitution", "w": ["Attending meetings and discussions", "Proposing topics for discussion", "Voting on resolutions"], "e": "Members normally attend, propose topics and vote, but no member can change the constitution unilaterally."}, {"q": "A state that participated in establishing an international organization is considered:", "c": "An original member", "w": ["An associate member", "A temporary member", "A suspended member"], "e": "States that took part in establishing the organization are its original members."}, {"q": "What is the principal practical difference between original membership and membership by accession?", "c": "Original members participated in drafting the constitutive instrument.", "w": ["Original members have permanent voting privileges.", "Members admitted by accession cannot propose resolutions.", "Members admitted by accession have fewer legal obligations."], "e": "Legal rights and obligations are the same; the practical difference is participation in drafting the constitutive instrument."}, {"q": "Withdrawal from an international organization is best defined as:", "c": "The voluntary termination of a state's membership", "w": ["The temporary suspension of a state's voting rights", "The forced removal of a state for violating international law", "The transfer of membership from one state to another"], "e": "Withdrawal is voluntary; suspension is temporary and expulsion is forced."}, {"q": "Under the Covenant of the League of Nations, withdrawal required:", "c": "A two-year notice and fulfillment of international obligations", "w": ["A six-month notice without additional conditions", "Approval from all permanent members", "A unanimous decision of the League's Assembly"], "e": "The Covenant required two years' notice together with fulfillment of international obligations."}, {"q": "What is the prevailing opinion concerning withdrawal from an international organization?", "c": "A member state has the right to withdraw but must notify the organization.", "w": ["Withdrawal is prohibited unless approved by all members.", "States may withdraw only for economic reasons.", "Withdrawal automatically requires a decision by an international court."], "e": "The prevailing view recognizes a right to withdraw, subject to notifying the organization."}, {"q": "Why did Indonesia notify the United Nations of its withdrawal in January 1965?", "c": "Malaysia was elected to the Security Council.", "w": ["The United Nations imposed economic sanctions on Indonesia.", "Indonesia was denied voting rights in the General Assembly.", "The United Nations rejected Indonesia's membership application."], "e": "Indonesia gave notice of withdrawal following Malaysia's election to the Security Council."}, {"q": "Which of the following best describes suspension of membership?", "c": "Temporary restriction of participation in the organization's activities", "w": ["Permanent termination of membership", "Voluntary departure from the organization", "Automatic cancellation of all international treaties"], "e": "Suspension only temporarily restricts participation; membership itself continues."}, {"q": "Under Article 6 of the United Nations Charter, which bodies are involved in the expulsion of a member state?", "c": "The General Assembly and the Security Council", "w": ["The International Court of Justice and the Secretary-General", "The Economic and Social Council and the General Assembly", "The Security Council and the International Monetary Fund"], "e": "Expulsion under Article 6 involves the General Assembly acting upon the Security Council's recommendation."}, {"q": "Which international organization expelled Czechoslovakia in 1954 for failing to pay its capital shares?", "c": "The World Bank", "w": ["The United Nations", "The League of Nations", "The International Monetary Fund"], "e": "The World Bank expelled Czechoslovakia in 1954 for non-payment of its capital shares."}, {"q": "Which organization expelled Cuba in 1962 despite the absence of an express expulsion provision in its constitutive instrument?", "c": "The Organization of American States", "w": ["The United Nations", "The World Bank", "The League of Nations"], "e": "The Organization of American States expelled Cuba in 1962 even without an express expulsion provision."}, {"q": "What is the main principle underlying the one-state-one-vote system?", "c": "Equality of states", "w": ["Economic superiority", "Population-based representation", "Military influence"], "e": "One-state-one-vote reflects the equality of states."}, {"q": "In the International Monetary Fund, a state may have more voting power than another state primarily because of:", "c": "Its economic size and financial contribution", "w": ["Its geographical size", "Its number of diplomatic representatives", "Its length of membership"], "e": "Weighted voting in the IMF reflects a state's economic size and financial contribution."}, {"q": "During a voting session, 60 member states are present. If a resolution requires consensus, which of the following situations satisfies that requirement?", "c": "All 60 states agree.", "w": ["31 states agree and 29 disagree.", "45 states agree and 15 disagree.", "59 states agree and one disagrees."], "e": "Consensus requires the agreement of all member states present, so even a single objection prevents it."}];
var Q=[],i=0,correct=0,locked=false;
function $(id){return document.getElementById(id)}
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}
function build(){
 var all=[];
 TF.forEach(function(t){all.push({q:t.q,opts:["True","False"],ans:t.a?0:1,ex:t.e})});
 MC.forEach(function(m){var o=shuf([m.c].concat(m.w));all.push({q:m.q,opts:o,ans:o.indexOf(m.c),ex:m.e})});
 Q=shuf(all);
}
function show(id){["start","game","end"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});if(id!=="game")$("prog").style.width=id==="end"?"100%":"0"}
function start(){build();i=0;correct=0;show("game");render()}
function render(){
 locked=false;var q=Q[i];
 $("qn").innerHTML="Question <b>"+(i+1)+"</b> of "+Q.length;
 $("sc").innerHTML="Correct: <b>"+correct+"</b>";
 $("prog").style.width=(i/Q.length*100)+"%";
 $("qt").textContent=q.q;$("fbw").innerHTML="";$("nextBtn").classList.add("hidden");
 $("nextBtn").textContent=i===Q.length-1?"See result":"Next question";
 var h=$("opts");h.innerHTML="";h.className="pop";
 q.opts.forEach(function(t,n){var b=document.createElement("button");b.className="opt";b.type="button";
  var l=document.createElement("span");l.className="l";l.textContent=String.fromCharCode(65+n);
  var s=document.createElement("span");s.textContent=t;b.appendChild(l);b.appendChild(s);
  b.onclick=function(){pick(n)};h.appendChild(b)});
}
function pick(n){
 if(locked)return;locked=true;var q=Q[i];var bs=$("opts").children;var ok=n===q.ans;
 if(ok)correct++;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;
  if(k===q.ans)bs[k].classList.add("ok");else if(k===n)bs[k].classList.add("bad");else bs[k].classList.add("fade")}
 $("sc").innerHTML="Correct: <b>"+correct+"</b>";
 var f=document.createElement("div");f.className="fb pop "+(ok?"ok":"bad");
 var s=document.createElement("strong");s.textContent=ok?"Correct!":"Not quite";
 var p=document.createElement("p");p.textContent=(ok?"":"Correct answer: "+q.opts[q.ans]+". ")+q.ex;
 f.appendChild(s);f.appendChild(p);$("fbw").appendChild(f);
 $("nextBtn").classList.remove("hidden");$("nextBtn").focus();
}
function next(){if(i<Q.length-1){i++;render()}else finish()}
function finish(){
 show("end");var pc=Math.round(correct/Q.length*100);
 $("fs").textContent=correct+" / "+Q.length;$("fp").textContent=pc+"%";
 $("fm").textContent=pc>=90?"Outstanding work!":pc>=70?"Well done!":pc>=50?"Good effort — keep practicing.":"Keep going — try again to improve.";
}
$("startBtn").onclick=start;$("restartBtn").onclick=start;$("nextBtn").onclick=next;
document.addEventListener("keydown",function(e){
 if($("game").classList.contains("hidden"))return;
 var k=e.key.toUpperCase();
 if(!locked&&k>="A"&&k<="D"){var n=k.charCodeAt(0)-65;if(n<Q[i].opts.length)pick(n)}
 else if(locked&&e.key==="Enter"&&document.activeElement!==$("nextBtn")){next()}
});
