<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IOS Quiz 9 | Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--txt:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 60% 50% at 100% 0%,rgba(36,84,190,.38),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%),var(--navy)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;flex:none}
.brand b{font-family:Georgia,serif;font-size:1.25rem;color:var(--gold);letter-spacing:.04em;white-space:nowrap}
.tag{font-size:.7rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:4px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:24px 16px}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.45);border-radius:16px;padding:26px 22px;box-shadow:0 12px 36px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.center{text-align:center}
.big{width:170px;height:170px;margin:4px auto 6px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.cj{font-family:Georgia,serif;color:var(--gold);font-size:1.5rem;letter-spacing:.12em;margin-bottom:14px}
.pres{font-size:.75rem;letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:700;font-size:2.2rem;margin:8px 0}
.line{width:70px;height:3px;background:var(--gold);margin:12px auto 16px;border-radius:2px}
.sub{color:var(--mut);margin-bottom:18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid rgba(214,177,88,.5);color:var(--gold);padding:6px 14px;border-radius:999px;font-size:.85rem;background:rgba(214,177,88,.07)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:14px 30px;background:linear-gradient(180deg,#E6C676,var(--gold));color:#1a1405;font-size:1.05rem;min-height:48px;box-shadow:0 4px 16px rgba(214,177,88,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(214,177,88,.4)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:14px}
.meta b{color:var(--gold)}
.qtxt{font-family:Georgia,serif;font-size:1.35rem;line-height:1.45;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.35);border-radius:12px;padding:13px 14px;min-height:56px;cursor:pointer;transition:all .2s}
.opt:hover:not(:disabled){background:rgba(214,177,88,.12);border-color:var(--gold);transform:translateX(3px)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}
.opt:disabled{cursor:default}
.opt.ok{background:rgba(63,166,107,.22);border-color:var(--green)}
.opt.ok .l{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:rgba(222,64,64,.22);border-color:var(--red)}
.opt.no .l{background:var(--red);border-color:var(--red);color:#fff}
.opt.fade{opacity:.4}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;border-left:4px solid;animation:pop .3s}
.fb.ok{background:rgba(63,166,107,.15);border-color:var(--green)}
.fb.no{background:rgba(222,64,64,.15);border-color:var(--red)}
.fb strong{display:block;font-size:1.05rem}
.fb p{color:var(--mut);margin-top:4px}
.nx{display:flex;justify-content:flex-end;margin-top:18px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pct{font-family:Georgia,serif;font-size:4.5rem;color:var(--gold);line-height:1}
.msg{color:var(--mut);margin:8px 0 18px}
h2{font-family:Georgia,serif;color:var(--gold);margin:26px 0 12px;font-size:1.3rem}
.rev{border:1px solid rgba(222,64,64,.5);background:rgba(222,64,64,.07);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.rev .rq{font-family:Georgia,serif;margin-bottom:8px}
.rev .y{color:#ff8f8f}.rev .c{color:#7fd9a2}
.rev div{font-size:.95rem}
.perfect{border:1px solid var(--green);background:rgba(63,166,107,.12);border-radius:12px;padding:16px;text-align:center}
.actions{display:flex;justify-content:center;margin-top:24px}
footer{text-align:center;padding:16px;border-top:1px solid rgba(214,177,88,.35);color:var(--gold);font-family:Georgia,serif;letter-spacing:.05em;font-size:.95rem}
.hide{display:none}
@media(max-width:560px){.tag{display:none}h1{font-size:1.7rem}.qtxt{font-size:1.2rem}.panel{padding:20px 16px}}
</style></head><body>

<script>
var QS=[{"t": "tf", "q": "International organizations are classified according to geographic, substantive, and composition criteria.", "a": true, "e": ""}, {"t": "tf", "q": "Universal organizations automatically grant membership to every state upon achieving statehood.", "a": false, "e": "Universal organizations are open to all qualified states, but membership is subject to specific legal and procedural requirements."}, {"t": "tf", "q": "The European Union is both a regional organization and an organization of general competence.", "a": true, "e": ""}, {"t": "tf", "q": "Specialized international organizations are authorized to exercise powers outside their specific functional sphere.", "a": false, "e": "Specialized organizations are bound by the principle of specialty."}, {"t": "tf", "q": "The International Labour Organization is a mixed organization because it includes government, employer, and worker representatives.", "a": true, "e": ""}, {"t": "tf", "q": "Original members of the United Nations enjoy greater legal rights in the General Assembly than members by admission.", "a": false, "e": "Both categories enjoy equal substantive legal rights and obligations."}, {"t": "tf", "q": "Participation in both the 1942 Declaration by United Nations and the 1945 San Francisco Conference was necessary to acquire original membership.", "a": false, "e": "Participation in either of them was sufficient, provided that the other original membership requirements were satisfied."}, {"t": "tf", "q": "Poland was one of the fifty-one original members of the United Nations despite its absence from the San Francisco Conference.", "a": true, "e": ""}, {"t": "tf", "q": "The small territory and population of a microstate automatically prevent it from acquiring UN membership.", "a": false, "e": "Microstates can acquire UN membership if they satisfy the required conditions."}, {"t": "tf", "q": "The modern interpretation of the peace-loving condition focuses on peaceful conduct, compliance with international law, and avoidance of aggressive foreign policies.", "a": true, "e": ""}, {"t": "tf", "q": "A candidate state may exclude certain provisions of the UN Charter by making unilateral reservations.", "a": false, "e": "A candidate state must accept the Charter in its entirety without reservations."}, {"t": "tf", "q": "The five substantive conditions for UN admission are exhaustive, and UN organs cannot legally impose additional conditions.", "a": true, "e": ""}, {"t": "tf", "q": "The General Assembly can admit a candidate state without a favorable recommendation from the Security Council.", "a": false, "e": "A favorable Security Council recommendation is an indispensable legal prerequisite."}, {"t": "tf", "q": "Abstentions are excluded when calculating the two-thirds majority required for admission in the General Assembly.", "a": true, "e": ""}, {"t": "tf", "q": "UN observers may deliver statements and submit documentation, but they cannot vote on resolutions or elect members to UN organs.", "a": true, "e": ""}, {"t": "mc", "q": "Which criterion classifies international organizations according to the nature of their members?", "o": ["Geographic criterion", "Substantive criterion", "Composition criterion", "Financial criterion"], "a": 2}, {"t": "mc", "q": "Which of the following is an example of a specialized international organization?", "o": ["World Health Organization", "United Nations", "European Union", "African Union"], "a": 0}, {"t": "mc", "q": "Representatives in intergovernmental organizations primarily express:", "o": ["Their personal academic opinions", "The interests of private corporations", "Their individual moral beliefs", "The official policies of their states"], "a": 3}, {"t": "mc", "q": "The distinction between original UN membership and membership by admission is primarily:", "o": ["Financial and economic", "Chronological and procedural", "Political and geographical", "Institutional and hierarchical"], "a": 1}, {"t": "mc", "q": "Why did the United Nations begin with fifty-one original member states rather than fifty?", "o": ["Switzerland joined immediately after the San Francisco Conference.", "Monaco was granted exceptional membership.", "Poland satisfied the founding participation requirement through the 1942 Declaration and subsequently signed and ratified the Charter.", "The Security Council admitted an additional state under Article 4."], "a": 2}, {"t": "mc", "q": "Which of the following is NOT a requirement of statehood under the Montevideo Convention of 1933?", "o": ["A permanent population", "A defined territory", "An effective government", "A minimum level of military power"], "a": 3}, {"t": "mc", "q": "A candidate state possesses sufficient administrative and financial resources but lacks the political intention to implement Charter obligations. Which condition does it fail to satisfy?", "o": ["Willingness to carry out Charter obligations", "Ability to carry out Charter obligations", "Possession of statehood", "Geographic eligibility"], "a": 0}, {"t": "mc", "q": "Which statement best describes the legal significance of the International Court of Justice's 1948 Advisory Opinion concerning UN admission?", "o": ["The Security Council may establish unlimited additional admission requirements.", "The five substantive conditions for admission are exhaustive.", "Economic development is an additional mandatory condition.", "The General Assembly may disregard all substantive conditions."], "a": 1}, {"t": "mc", "q": "Switzerland remained outside the United Nations for many years primarily because of concerns regarding:", "o": ["Its lack of sovereign territory", "Its inability to establish diplomatic relations", "The absence of an effective government", "A possible conflict between its neutrality and Chapter VII enforcement measures"], "a": 3}, {"t": "mc", "q": "Which of the following represents the correct procedural sequence for UN admission?", "o": ["Security Council recommendation → Application → General Assembly decision → Legal effectiveness", "Application → General Assembly decision → Security Council recommendation → Legal effectiveness", "Application → Security Council recommendation → General Assembly decision → Legal effectiveness", "Application → Security Council recommendation → Legal effectiveness → General Assembly decision"], "a": 2}, {"t": "mc", "q": "An admission application receives fourteen affirmative votes in the Security Council, but one permanent member votes against it. What is the legal result?", "o": ["The application is blocked by the veto.", "The recommendation passes because it receives more than nine votes.", "The General Assembly automatically admits the applicant.", "The applicant receives temporary membership."], "a": 0}, {"t": "mc", "q": "During a General Assembly vote on admission, 180 members are present. Of these, 100 vote in favor, 50 vote against, and 30 abstain. What is the result?", "o": ["The resolution fails because 120 affirmative votes are required.", "The resolution passes because 100 affirmative votes constitute exactly two-thirds of the active votes.", "The resolution fails because abstentions are counted as negative votes.", "The resolution requires unanimous approval."], "a": 1}, {"t": "mc", "q": "A permanent Security Council member supports an admission recommendation but subsequently votes against admission in the General Assembly. What happens if the required General Assembly majority is achieved?", "o": ["The negative vote automatically constitutes a veto.", "The application must return to the Security Council.", "The applicant receives observer status only.", "The applicant is legally admitted because the veto operates exclusively within the Security Council."], "a": 3}, {"t": "mc", "q": "What was the primary purpose of package deals during the Cold War?", "o": ["To replace the substantive conditions of membership", "To grant permanent Security Council membership to microstates", "To overcome political deadlocks through the simultaneous admission of states belonging to opposing geopolitical blocs", "To eliminate the Security Council's role in admission"], "a": 2}, {"t": "mc", "q": "Which of the following rights distinguishes full UN members from UN observers?", "o": ["The right to vote on General Assembly resolutions", "The right to attend public meetings", "The right to deliver statements", "The right to submit documentation"], "a": 0}];
var T={"tf":"True / False","mc":"Multiple Choice"};
var app=document.getElementById("app"),pb=document.getElementById("pb"),tag=document.getElementById("tag");
var list,idx,score,wrong,locked;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
  var tf=QS.filter(function(q){return q.t==="tf"}).length,mc=QS.length-tf;
  pb.style.width="0";tag.textContent="IOS QUIZ 9";
  app.innerHTML='<div class="panel center"><img class="big" src="'+document.querySelector('.brand img').src+'" alt="Center JUST logo"><div class="cj">Center JUST</div><div class="pres">Center JUST presents</div><h1>IOS Quiz 9</h1><div class="line"></div><p class="sub">Welcome to Center JUST, please answer the following questions.</p><div class="chips"><span class="chip">'+QS.length+' Questions</span><span class="chip">'+tf+' True / False</span><span class="chip">'+mc+' Multiple Choice</span></div><button class="btn" id="go">Start Quiz</button></div>';
  document.getElementById("go").onclick=begin;
}
function begin(){list=shuffle(QS);idx=0;score=0;wrong=[];show()}
function show(){
  locked=false;var q=list[idx];pb.style.width=(idx/list.length*100)+"%";tag.textContent="QUESTION "+(idx+1)+" · "+T[q.t].toUpperCase();
  var opts=q.t==="tf"?["True","False"]:q.o,h="";
  opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><span class="l">'+(q.t==="tf"?(i?"F":"T"):"ABCD"[i])+'</span><span>'+esc(o)+'</span></button>'});
  app.innerHTML='<div class="panel"><div class="meta"><span>Question <b>'+(idx+1)+'</b> of '+list.length+'</span><span><b>'+score+'</b> correct</span></div><div class="qtxt">'+esc(q.q)+'</div><div class="opts">'+h+'</div><div id="fb"></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.i)}});
}
function corrIdx(q){return q.t==="tf"?(q.a?0:1):q.a}
function label(q,i){return q.t==="tf"?(i?"False":"True"):(("ABCD"[i])+". "+q.o[i])}
function pick(i){
  if(locked)return;locked=true;var q=list[idx],c=corrIdx(q),ok=i===c;
  if(ok)score++;else wrong.push({q:q,i:i});
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b,k){b.disabled=true;if(k===c)b.classList.add("ok");else if(k===i)b.classList.add("no");else b.classList.add("fade")});
  var last=idx===list.length-1,ex=(q.e&&!ok)||(q.e&&ok&&false)?q.e:"";
  if(q.e)ex=q.e;
  var fb='<div class="fb '+(ok?"ok":"no")+'"><strong>'+(ok?"Correct":"Not quite")+'</strong>'+(ok?"":'<p>Correct answer: '+esc(label(q,c))+'</p>')+(ex?'<p>'+esc(ex)+'</p>':'')+'</div><div class="nx"><button class="btn" id="nx">'+(last?"See result":"Next question")+'</button></div>';
  document.getElementById("fb").innerHTML=fb;
  document.querySelector(".meta span:last-child").innerHTML='<b>'+score+'</b> correct';
  var n=document.getElementById("nx");n.onclick=next;n.focus();
}
function next(){idx++;if(idx>=list.length)result();else show()}
function result(){
  pb.style.width="100%";tag.textContent="RESULTS";
  var p=Math.round(score/list.length*100),h='<div class="panel"><div class="center"><div class="pct">'+score+' / '+list.length+'</div><div class="msg">'+p+'% correct</div></div>';
  if(!wrong.length)h+='<div class="perfect"><strong>Excellent! You answered every question correctly.</strong></div>';
  else{h+='<h2>Questions you answered incorrectly</h2>';wrong.forEach(function(w,k){var q=w.q;h+='<div class="rev"><div class="rq">'+(k+1)+'. '+esc(q.q)+'</div><div class="y">Your answer: '+esc(label(q,w.i))+'</div><div class="c">Correct answer: '+esc(label(q,corrIdx(q)))+'</div>'+(q.e?'<div style="color:var(--mut);margin-top:4px">'+esc(q.e)+'</div>':'')+'</div>'})}
  h+='<div class="actions"><button class="btn" id="rs">Restart the Quiz</button></div></div>';
  app.innerHTML=h;document.getElementById("rs").onclick=begin;window.scrollTo(0,0);
}
document.addEventListener("keydown",function(e){
  if(!list||!document.querySelector(".opt"))return;
  var k=e.key.toLowerCase(),q=list[idx];
  if(!locked){var m=q.t==="tf"?{t:0,f:1}:{a:0,b:1,c:2,d:3};if(m[k]!==undefined&&!(q.t==="tf"&&0))pick(m[k])}
});
start();
</script></body></html>
