<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1c2733}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.head{text-align:center;margin-bottom:14px}
.head img{width:150px;max-width:40vw;height:auto;display:block;margin:0 auto}
.tag{color:#1b4fa8;font-weight:700;font-size:1.08rem;margin-top:6px}
.card{background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 6px 24px rgba(20,40,80,.1);text-align:center}

.welcome{font-size:1.05rem;margin:0 0 14px}.count{font-weight:700;margin-bottom:22px}
.btn{background:#1b4fa8;color:#fff;border:0;border-radius:12px;font-weight:700;font-size:1.1rem;padding:16px 34px;cursor:pointer;width:100%;max-width:320px;transition:.2s}
.btn:hover{background:#163f88}
.qn{font-weight:700;color:#1b4fa8;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin-bottom:18px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #d5dde8;border-radius:12px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:#1b4fa8;background:#eef4ff}
.opt:disabled{cursor:default}
.opt.ok{background:#e5f7ec;border-color:#1e9e4a}
.opt.bad{background:#fdeaea;border-color:#d63a3a}
.fb{border-radius:10px;padding:12px;font-weight:700;margin:12px 0 8px}
.fb.ok{background:#e5f7ec;color:#14703a}.fb.bad{background:#fdeaea;color:#a42a2a}
.ca{background:#e5f7ec;color:#14703a;border-radius:10px;padding:12px;font-weight:600;margin-bottom:12px;text-align:left}
.score{font-size:3rem;font-weight:800;color:#1b4fa8;margin:8px 0}.pct{font-size:1.6rem;font-weight:700;color:#14703a}
.msg{font-size:1.3rem;font-weight:700;margin:12px 0 22px}
.hide{display:none}

<script>
const MCQ=[
["Public international law governs the relationship between:","States and international organizations",["Individuals and corporations","Only individual citizens","Corporations with a foreign element only"]],
["Private international law is the set of rules governing:","Cross-border transactions between individuals or corporations with a foreign element",["The relationship between states and international organizations","Relationships between states only","The internal structure of the UN"]],
["Public international law has traditionally been made by states, normally through:","Treaties or state practice (custom)",["Commercial contracts","Corporate regulations","Decisions of individuals"]],
["An international organization is defined as:","An international legal person with certain powers vested in it according to its constitutive instruments",["A collection of the wills of its member states that meets temporarily","A sovereign entity with supreme authority","A conference convened to discuss one issue"]],
["For the UN, the constitutive instrument is:","The UN Charter",["A conference resolution","The IMF statute","A World Bank loan agreement"]],
["The modern state is generally defined by which three core elements?","A defined territory, a population, and a sovereign government",["A defined territory, an army, and a constitution","A population, a currency, and a parliament","A sovereign government, an economy, and an army"]],
["Which actors are described as secondary actors, created by states?","International Organizations (IOs)",["States","International conferences","Empires and caliphates"]],
["Historically, the primary tool of international relations was:","Military force",["International trade","International conferences","Economic hegemony"]],
["Which is a limitation of international conferences?","They lack an independent will",["They have a permanent structure","They always reach a resolution","They have their own separate legal personality"]],
["The First World War took place in:","1914-1918",["1939-1945","1919-1923","1910-1914"]],
["What was the first major international organization?","The League of Nations",["The United Nations","The International Monetary Fund","The World Trade Organization"]],
["Why did the League of Nations effectively break down?","It was unable to prevent the aggression and conflicts that led to World War II in 1939",["It lacked a clear mandate to protect peace","It was replaced by international conferences in 1914","Russia refused to take part in its establishment"]],
["What was the first goal of Cornerstone 1 of the new international order?","To prevent a third world war",["To promote open markets globally","To provide low-interest loans","To establish economic hegemony"]],
["According to Cornerstone 2, one of the root causes of war is:","Economic underdevelopment and poverty",["An excess of international conferences","Open markets","A lack of military force"]],
["The International Monetary Fund (IMF) provides:","Short-term financial support to countries facing economic crises",["Loans for long-term dam and power plant projects","Promotion of international trade","Oversight of international peace and security"]],
["The World Bank Group provides:","Loans for long-term development projects",["Short-term support to stabilize crises only","Regulation of global trade","Peacekeeping forces"]],
["What happened to Egypt's initial World Bank loan application for the Aswan High Dam?","It was rejected for political reasons, so Egypt built it over a much longer period",["It was approved and the dam was built quickly","It was funded by the WTO","It was withdrawn by Egypt"]],
["Cornerstone 3, the promotion of international trade, would eventually lead to the creation of:","The World Trade Organization (WTO)",["The International Monetary Fund","The League of Nations","The World Bank Group"]],
["In the context of the new order, hegemony means:","The dominance of one state or group over others (economic dominance)",["Equality among all states","The prohibition of the use of force","The financial support given to developing countries"]],
["GDP (Gross Domestic Product) is:","The total value of all goods and services produced in a country in a year",["The total debt owed to the World Bank","The number of companies in a country","The military spending of a state"]]
];
const TF=[
["The topic of international organization falls within the scope of Public international law.",true],
["An international organization has unlimited power.",false],
["States are the secondary actors in the international system, while IOs are the primary and original actors.",false],
["Treaties proliferated after the Second World War, establishing new norms and codifying international custom.",true],
["An international conference has its own separate legal personality and authority.",false],
["The Second World War was less destructive than the first.",false],
["The United Nations was created to replace the failed League of Nations.",true],
["The World Bank Group and the IMF were designed to provide financial support, mainly through low-interest loans, to developing and least-developed countries.",true],
["A single company like Apple has a market valuation larger than the entire GDP of many nations, like Egypt.",true],
["According to the text, the open-market system presents no challenge for developing countries.",false]
];
const T=["True","False"];
const app=document.getElementById("app");
let qs=[],i=0,score=0;

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function build(){
 const all=MCQ.map(m=>({q:m[0],c:m[1],o:shuf([m[1]].concat(m[2]))}))
  .concat(TF.map(t=>({q:t[0],c:t[1]?"True":"False",o:T})));
 qs=shuf(all);i=0;score=0;
}
function start(){
 app.innerHTML='<h1>Int. Organizations Quiz 1</h1><p class="welcome">Welcome to Center JUST, please answer the following questions.</p><div class="count">30 Questions</div><button class="btn" id="go">START QUIZ</button>';
 document.getElementById("go").onclick=()=>{build();show()};
}
function show(){
 const q=qs[i];
 app.innerHTML='<div class="qn">Question '+(i+1)+' of 30</div><div class="q">'+esc(q.q)+'</div><div id="opts"></div><div id="fb"></div><button class="btn hide" id="nx">'+(i==29?"See Results":"Next Question")+'</button>';
 const box=document.getElementById("opts");
 q.o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
 document.getElementById("nx").onclick=()=>{i++;i<30?show():result()};
}
function pick(btn,t){
 const q=qs[i],right=t===q.c;
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q.c)b.classList.add("ok")});
 const fb=document.getElementById("fb");
 if(right){score++;fb.innerHTML='<div class="fb ok">Correct ✓</div>'}
 else{btn.classList.add("bad");fb.innerHTML='<div class="fb bad">Incorrect ✗</div><div class="ca">Correct Answer: '+esc(q.c)+'</div>'}
 document.getElementById("nx").classList.remove("hide");
}
function result(){
 const p=Math.round(score/30*100);
 const m=p>=90?"Excellent":p>=80?"Very Good":p>=70?"Good":p>=60?"Fair":"Needs More Review";
 app.innerHTML='<h1>Your Final Score</h1><div class="score">'+score+' / 30</div><div class="pct">'+p+'%</div><div class="msg">'+m+'</div><button class="btn" id="rs">Restart Quiz</button>';
 document.getElementById("rs").onclick=()=>{build();show()};
}
start();
