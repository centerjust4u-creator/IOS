<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>International Organizations – Quiz 3 | Center JUST</title>
<style>
:root{--navy:#0a1226;--navy2:#142143;--parch:#f4ebd4;--ink:#1d2433;--brass:#c9a24b;--blue:#1d4fb8;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Palatino Linotype',Palatino,Georgia,serif;color:var(--parch);background:radial-gradient(circle at 50% 0,var(--navy2),var(--navy) 65%) fixed;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:720px}
.logo{display:block;margin:0 auto;width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px var(--brass),0 8px 30px #000a}
.brand{text-align:center;font-size:1.5rem;letter-spacing:.12em;color:var(--brass);margin:12px 0 18px}
.card{background:var(--parch);color:var(--ink);border:2px solid var(--brass);border-radius:14px;padding:26px 22px;box-shadow:0 0 0 5px #0a1226,0 0 0 7px var(--brass)66,0 18px 40px #000a}
h1{margin:0 0 8px;font-size:1.7rem;text-align:center;color:#12285e}
.sub{text-align:center;margin:0 0 18px;font-style:italic}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.stats span{border:1px solid var(--brass);border-radius:20px;padding:5px 14px;background:#fff8;font-size:.95rem}
button{font:inherit;cursor:pointer}
.btn{display:block;margin:0 auto;background:linear-gradient(#d8b45e,#b58a2e);color:#1a1405;border:0;border-radius:10px;padding:14px 34px;font-size:1.15rem;font-weight:bold;box-shadow:0 4px 0 #7a5c17;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5c17}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:1rem}
.top img{width:44px;height:44px;border-radius:50%;border:2px solid var(--brass)}
.top b{color:var(--brass)}
.bar{height:8px;background:#ffffff22;border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a1f,var(--brass));transition:width .4s}
.q{font-size:1.3rem;line-height:1.5;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 14px;background:#fffdf6;color:var(--ink);border:2px solid #c9b98a;border-radius:10px;font-size:1.05rem;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--brass);transform:translateX(4px)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:#12285e;color:var(--parch);display:grid;place-items:center;font-weight:bold}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blue);border-color:#0f3282;color:#fff}
.opt.bad{background:var(--red);border-color:#7d1712;color:#fff;animation:sh .35s}
.opt.dim{opacity:.55}
.opt.ok .l,.opt.bad .l{background:#fff;color:var(--ink)}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;border-left:6px solid;background:#fff9;display:none}
.fb.ok{border-color:var(--blue)}.fb.bad{border-color:var(--red)}
.fb strong{display:block;margin-bottom:4px;font-size:1.1rem}
.fb.ok strong{color:var(--blue)}.fb.bad strong{color:var(--red)}
.next{margin-top:16px;display:none}
.score{font-size:3rem;text-align:center;color:#12285e;margin:8px 0}
.msg{text-align:center;font-style:italic;margin-bottom:20px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.card{padding:20px 14px}.q{font-size:1.15rem}.logo{width:120px;height:120px}}

["An international organization needs legal personality in order to operate effectively at the international level.",true,"Legal personality gives an organization the standing it needs to act internationally."],
["Legal personality enables an international organization to acquire rights and be subject to obligations.",true,"Acquiring rights and bearing obligations is the essence of legal personality."],
["The G7 has an independent legal personality similar to that of the United Nations.",false,"The UN has an independent legal personality; the G7 does not."],
["Without legal personality, the decisions of an international organization would not be binding on its members.",true,"Without a separate will, decisions are not binding on members."],
["A decision adopted by the Security Council reflects the individual wills of its member states rather than the will of the Security Council itself.",false,"Thanks to legal personality, the decision is the organization's own will, not the sum of individual state wills."],
["The ICJ issued its advisory opinion in the Reparation Case in 1949.",true,"The ICJ delivered the Reparation Case opinion in 1949."],
["The Reparation Case related specifically to the United Nations.",true,"The case concerned the UN and recognized its legal personality."],
["The constitutive instrument is considered the constitution of an international organization.",true,"It establishes the organization and sets out its structure and powers."],
["Granting international organizations legal personality makes their legal personality identical to that of states.",false,"Their personality differs in nature and scope from that of states."],
["International organizations have no defined territory and no military to use against external powers.",true,"This is one reason their legal personality differs from that of states."],
["The 1957 Treaty of Rome explicitly provided that the European Economic Community would have legal personality.",true,"The Treaty of Rome contained an express provision on the EEC's legal personality."],
["All scholars agree that an express provision in the constituent treaty is necessary for an organization to possess legal personality.",false,"Scholars do not agree on this; an express provision is not universally considered necessary."],
["An express statement on legal personality gives an organization a strong legal basis to defend its personality and bind member states with its decisions.",true,"An express statement removes doubt and strengthens the organization's position."],
["Legal personality may give an international organization treaty-making capacity and the capacity to bring claims before international tribunals.",true,"Both are practical consequences of having legal personality."],
["An international organization can potentially be held accountable for acts of its peacekeeping forces if the elements of legal liability exist and the acts are attributed to it.",true,"Responsibility arises when liability elements exist and the conduct is attributable to the organization."]];

["What does legal personality enable an international organization to acquire?",["Rights","Territory","Population","Military forces"],"Legal personality enables an organization to acquire rights and bear obligations."],

["The constitutive instrument is considered:",["The constitution of an international organization","A diplomatic immunity","A judgment against member states","A military agreement"],"It is the founding document, i.e. the organization's constitution."],

["Which of the following is NOT a reason for the different nature of the legal personality of international organizations?",["They were historically established before states.","They do not have a defined territory.","They do not have a military to use against external powers.","They are created by states to achieve common purposes."],"Organizations are created by states, so they were not established before states."],
["Which treaty explicitly granted legal personality to the European Economic Community?",["Treaty of Rome","Treaty of Paris","Treaty of Vienna","UN Charter"],"The 1957 Treaty of Rome did so expressly."],
["Why is an express provision concerning legal personality useful?",["It avoids doubt concerning the organization's separate will.","It gives the organization territory.","It eliminates any need for member states.","It gives the organization a military."],"It removes doubt that the organization has a will separate from its members."],
["Without an express provision in the constitutive instrument, states may argue that:",["The organization lacks a separate and independent legal personality.","The organization has no members.","The organization has become a state.","The organization cannot have a budget."],"The absence of an express provision lets states contest the organization's separate personality."],
["Which of the following is an aspect of the importance of legal personality?",["Treaty-making capacity","A defined national territory","A permanent national population","Sovereignty over member states"],"Legal personality gives the capacity to conclude treaties."],
["If an international organization breaches an international obligation, its legal personality may trigger:",["International responsibility","State sovereignty","Diplomatic recognition","Territorial expansion"],"Being a legal person means it can bear international responsibility for breaches."],
["When may an international organization potentially be held accountable for unlawful acts committed by its peacekeeping forces?",["When the elements of legal liability exist and the acts are attributed to the organization","Whenever the forces operate outside the organization's headquarters","Only when a member state accepts responsibility","Never; international organizations cannot be held accountable"],"Accountability depends on legal liability elements and attribution to the organization."]];
